<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RACEWAY 재고관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --top-h:48px; --tab-h:40px;
  --ink:#1c2430; --ink-2:#4a5568; --ink-3:#8a94a6;
  --steel:#1f2733; --steel-2:#28323f; --steel-3:#343f50;
  --paper:#f1f3f6; --white:#fff; --line:#dfe3ea; --line-2:#303b4c;
  --amber:#f2a93b; --green:#2fb27c; --red:#e05a4a; --blue:#3b82f6; --gray:#9aa4b5;
  --r:6px; --shadow:0 8px 24px rgba(20,28,40,.18);
  font-size:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Pretendard,-apple-system,"Malgun Gothic","맑은 고딕",sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#c2c9d4;border-radius:4px}

.app{display:grid;grid-template-columns:1fr;grid-template-rows:var(--top-h) 1fr;height:100vh;height:100dvh}
.top{display:flex;align-items:center;background:var(--steel);color:#dfe5ee;padding:0 12px 0 0;border-bottom:1px solid var(--line-2);position:relative;z-index:50}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.brand{height:100%;display:flex;align-items:center;gap:10px;padding:0 16px 0 14px;flex-shrink:0;cursor:pointer;border-right:1px solid var(--line-2)}
.brand .mark{width:28px;height:28px;display:grid;place-items:center;background:var(--amber);color:var(--steel);font-weight:800;border-radius:6px}
.brand .name{font-weight:700;letter-spacing:.3px;white-space:nowrap;color:#fff;display:flex;align-items:center;gap:8px}
.brand:hover .name{color:var(--amber)}
.brand .name small{font-weight:400;color:#8f9bb0}
.top-menu{display:flex;gap:2px;margin-left:8px;height:100%}
.top-menu>li{position:relative;list-style:none;height:100%;display:flex}
.top-menu>li>button{padding:0 16px;height:100%;color:#c7cfdb;font-weight:600;font-size:15px;border-bottom:2px solid transparent;white-space:nowrap}
.top-menu>li:hover>button,.top-menu>li.on>button{color:#fff;border-bottom-color:var(--amber)}
.top-menu>li.pin>button{color:#fff;border-bottom-color:var(--amber);background:var(--steel-2)}
.mega{position:absolute;top:100%;left:0;display:none;background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:0 0 var(--r) var(--r);box-shadow:var(--shadow);padding:14px 4px;z-index:60;flex-wrap:wrap;width:max-content;max-width:calc(100vw - 24px)}
.top-menu>li:hover .mega,.top-menu>li.pin .mega{display:flex}
.mega .col{padding:0 16px 8px;border-right:1px solid var(--line);min-width:150px}
.mega .col:last-child{border-right:0}
.mega h4{font-size:14px;color:var(--ink-3);font-weight:600;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line);white-space:nowrap}
.mega a{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:14px;color:var(--ink);text-decoration:none;white-space:nowrap;cursor:pointer}
.mega a:hover{color:var(--blue)}
.mega a.active{color:var(--blue);font-weight:600}
.mega a small{color:var(--ink-3);font-size:11px}
.search{margin-left:auto;position:relative;width:240px}
.search input{width:100%;height:32px;background:var(--steel-2);border:1px solid var(--line-2);border-radius:var(--r);color:#fff;padding:0 10px 0 30px;outline:0}
.search input:focus{border-color:var(--amber)}
.search input::placeholder{color:#7f8aa0}
.search .ico{position:absolute;left:10px;top:8px;color:#7f8aa0}
.search-res{position:absolute;top:36px;left:0;right:0;background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);display:none;max-height:360px;overflow:auto;z-index:80}
.search-res.open{display:block}
.search-res button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:9px 12px}
.search-res button:hover{background:#eef2f8}
.search-res small{color:var(--ink-3)}
.top-actions{display:flex;align-items:center;gap:4px;margin-left:12px}
.icon-btn{height:34px;padding:0 10px;border-radius:var(--r);display:flex;gap:6px;align-items:center;color:var(--amber);border:1px solid var(--line-2);font-size:13px;white-space:nowrap}
.icon-btn:hover{color:#fff;border-color:var(--amber)}
.dd{position:relative}
.dd-menu{position:absolute;top:calc(100% + 6px);right:0;min-width:230px;background:var(--white);color:var(--ink);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;display:none;z-index:90}
.dd.open .dd-menu{display:block}
.dd-menu button,.dd-menu label{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:4px;text-align:left;cursor:pointer}
.dd-menu button:hover,.dd-menu label:hover{background:#eef2f8}
.dd-menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.dd-menu .hd{padding:6px 10px;font-size:11px;color:var(--ink-3)}
.mobile-nav{display:none;margin-left:auto}
.mobile-nav select{height:32px;background:var(--steel-2);color:#fff;border:1px solid var(--line-2);border-radius:var(--r);padding:0 8px;max-width:46vw}

.tabs{display:flex;align-items:flex-end;height:var(--tab-h);background:#e4e8ee;border-bottom:1px solid var(--line);padding:0 8px;gap:2px;flex-shrink:0}
.tabs-scroll{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tabs-scroll::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px 0 12px;background:#d6dce5;border-radius:6px 6px 0 0;color:var(--ink-2);white-space:nowrap;cursor:pointer;border:1px solid transparent;border-bottom:0;font-size:14px;user-select:none}
.tab:hover{background:#e9edf3}
.tab.active{background:var(--white);color:var(--ink);border-color:var(--line);font-weight:600;position:relative}
.tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--white)}
.tab .x{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;color:var(--ink-3);font-size:14px;line-height:1}
.tab .x:hover{background:#c8cfda;color:var(--ink)}
.tabs-act button{width:28px;height:28px;border-radius:4px;color:var(--ink-3)}
.tabs-act button:hover{background:#d6dce5;color:var(--ink)}
.crumb{display:flex;align-items:center;gap:6px;padding:8px 18px;color:var(--ink-3);font-size:13px;background:var(--white);border-bottom:1px solid var(--line)}
.crumb b{color:var(--ink);font-weight:600}
.stage{flex:1;min-height:0;position:relative;background:var(--white);overflow:hidden}
.screen{position:absolute;inset:0;overflow:auto;display:none;padding:16px 18px;background:var(--paper)}
.screen.on{display:block}
.status{height:24px;background:var(--steel);color:#8f9bb0;font-size:11px;display:flex;align-items:center;gap:18px;padding:0 14px;flex-shrink:0}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;margin-right:5px}
.status .r{margin-left:auto}

/* 화면 공통 */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card h3{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h3 span{font-size:12px;color:var(--ink-3);font-weight:400}
.lay{display:grid;grid-template-columns:380px 1fr;gap:14px;align-items:start}
.lay.wide{grid-template-columns:1fr}
.stack{display:grid;gap:14px}
.form{display:grid;grid-template-columns:110px 1fr;gap:7px 8px;align-items:center}
.form label{text-align:right;color:var(--ink-2);font-size:13px}
.form input,.form select{height:32px;border:1px solid var(--line);border-radius:4px;padding:0 8px;width:100%;background:#fff}
.form input:focus,.form select:focus{outline:0;border-color:var(--blue)}
.form input.num{text-align:right}
.form .hint{grid-column:2;font-size:12px;color:var(--ink-3);margin-top:-4px}
.form .full{grid-column:1/-1}
.form .chk{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px}
.form .chk input{width:auto;height:auto}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;grid-column:1/-1}
.btn{height:32px;padding:0 14px;border-radius:4px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue);background:#f4f8ff}
.btn.pri{background:var(--steel);color:#fff;border-color:var(--steel);font-weight:600}
.btn.pri:hover{background:var(--steel-3);color:var(--amber)}
.btn.amb{background:var(--amber);color:var(--steel);border-color:var(--amber);font-weight:600}
.btn.danger:hover{border-color:var(--red);color:var(--red);background:#fff5f4}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{font-size:13px;color:#2f5496;background:#eef3fb;border-radius:4px;padding:8px 10px;line-height:1.6;white-space:pre-line;margin-top:8px;min-height:20px}
.note{font-size:12px;color:var(--ink-3);line-height:1.6;margin-top:8px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar input,.bar select{height:32px;border:1px solid var(--line);border-radius:4px;padding:0 8px;background:#fff}
.bar .sp{flex:1}
.tw{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:4px;background:#fff}
table.g{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;white-space:nowrap}
table.g th{position:sticky;top:0;background:#2f3d50;color:#fff;font-weight:600;padding:7px 8px;text-align:center;border-right:1px solid #44536a;z-index:2;cursor:pointer;user-select:none}
table.g th:hover{background:#3b4b62}
table.g th.sorted::after{content:" ▲";font-size:10px;color:var(--amber)}
table.g th.sorted.desc::after{content:" ▼"}
table.g.nosort th{cursor:default}table.g.nosort th:hover{background:#2f3d50}
.bulk textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:4px;padding:8px;font-family:ui-monospace,Consolas,monospace;font-size:12px;resize:vertical}
.bulk details{margin-top:4px}.bulk summary{cursor:pointer;color:var(--ink-2);font-size:13px;font-weight:600;padding:4px 0}
.bulk .res{font-size:12px;line-height:1.6;margin-top:6px;white-space:pre-line}
.bulk .res.err{color:var(--red)}.bulk .res.ok{color:#1d7a55}
.h3btn{margin-left:auto;display:flex;gap:4px}
.btn.sm{height:26px;padding:0 9px;font-size:12px}
table.g td{padding:5px 8px;border-bottom:1px solid #edf0f4;border-right:1px solid #f1f3f6;text-align:right}
table.g td.l,table.g th.l{text-align:left}
table.g td.c{text-align:center}
table.g td.wrap{white-space:normal;max-width:380px;line-height:1.5}
table.g tr:hover td{background:#f4f8ff}
table.g tr.sub td{background:#f6f7f9}
table.g tr.warn td{background:#fff0ee}
table.g tr.sel td{background:#fff5dd}
table.g tr.diff td{background:#fffbea}
table.g .neg{color:var(--red);font-weight:600}
table.g .b{font-weight:700}
table.g td.sticky,table.g th.sticky{position:sticky;left:0;background:#fff;z-index:1}
table.g th.sticky{z-index:3;background:#2f3d50}
table.g th.hg{background:#1d7a55}table.g th.hg:hover{background:#249466}
table.g th.ha{background:#8a6d1f}table.g th.ha:hover{background:#a3832a}
table.g th.hr{background:#5c6675}
table.g td input.cell{width:80px;height:26px;border:1px solid var(--line);border-radius:4px;text-align:right;padding:0 6px}
/* 물류 보드 */
table.board{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;white-space:nowrap;background:#fff}
table.board th{position:sticky;top:0;z-index:2;height:30px;padding:0 8px;line-height:30px;text-align:center;color:#fff;font-weight:600;border-right:1px solid rgba(255,255,255,.15);box-sizing:border-box}
table.board th.g0{background:#2f3d50}table.board th.g1{background:#8a6d1f}table.board th.g2{background:#5c6675}table.board th.g3{background:#1d7a55}table.board th.g4{background:#2f5496}table.board th.g5{background:#5a4632}table.board th.g6{background:#6d3f8e}table.board th.g7{background:#b5541c}table.board th.g8{background:#1f6f8b}table.board th.g9{background:#7a2e2e}
table.board th.sub{top:30px;font-weight:500;font-size:12px;filter:brightness(1.15)}
table.board td{height:30px;padding:0;line-height:30px;border-bottom:1px solid #edf0f4;border-right:1px solid #f1f3f6;text-align:right;vertical-align:middle;box-sizing:border-box}
table.board td.lbl{text-align:left;padding:0 8px;font-weight:600;background:#fff;position:sticky;left:0;z-index:1}table.board td.lbl{min-width:150px;max-width:150px;width:150px;box-sizing:border-box}table.board .prd{position:sticky;left:150px;z-index:1;background:#fff;font-size:10.5px;font-weight:600;color:var(--ink-3);text-align:center;padding:0 6px;min-width:52px;box-sizing:border-box}table.board th.prd{z-index:3;color:#fff}table.board td.prd.in{color:#2f5496}table.board td.prd.out{color:#8a6d1f}table.board tr.model td.prd{background:#eef2f8}table.board tr.r2 td{border-bottom:1px solid #c9d2de}table.board tr:not(.r2) td:not([rowspan]){border-bottom:1px dotted #e3e8ef}table.board .obars{height:30px}.ob.one{height:20px;line-height:18px}.ob .orow.one{height:100%;top:0}.ob.one b{padding:0 4px}
table.board tr.model td.lbl{background:#eef2f8;color:#1c2430}
table.board tr.model td{background:#f6f8fb}
table.board td.cell{cursor:context-menu;position:relative;padding:0 22px 0 8px;min-width:88px}
table.board td.cell:hover{background:#fff5dd}
table.board td.cell .dots{position:absolute;right:4px;top:50%;transform:translateY(-50%);color:#b0b8c4;font-size:14px;line-height:1;padding:0 3px;border-radius:3px}
table.board td.cell:hover .dots{color:var(--ink);background:#f3d79a}
table.board td.cell.zero{color:#b0b8c4}
table.board td.cell.neg{color:var(--red);font-weight:600}
table.board td.na{background:#fafafa;color:#d0d5dd;text-align:center}
table.board td.lbl .mv{float:right;margin-left:6px;visibility:hidden}table.board tr:hover td.lbl .mv{visibility:visible}table.board td.lbl .mv button{border:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:9px;line-height:1;padding:3px 4px;border-radius:3px;cursor:pointer;margin-left:2px}table.board td.lbl .mv button:hover{background:var(--amber);color:#fff;border-color:var(--amber)}
table.board td.lbl .lblw{display:flex;align-items:center;gap:6px;height:30px}table.board td.lbl .mv{margin-left:auto}
table.board td.ord{padding:0 4px;text-align:center;min-width:104px}.obars{display:inline-flex;gap:4px;align-items:center;height:32px}.ob{position:relative;display:inline-block;min-width:96px;height:20px;line-height:18px;border:1px solid #c9d2de;border-radius:3px;background:#f3f5f8;font-size:10.5px;text-align:center;overflow:hidden;white-space:nowrap;padding:0 4px;vertical-align:middle}.ob{height:26px;line-height:24px;padding:0}.ob .orow{position:absolute;left:0;right:0;height:50%;top:0}.ob .orow.out{top:50%;border-top:1px solid #fff}.ob .orow i{position:absolute;top:0;bottom:0;left:0}.ob .orow.no{background:#fdeceb}.ob .orow.part{background:#fff4e0}.ob .orow.part .a{background:#f3c977}.ob .orow.done{background:#e4f3ec}.ob .orow.done .f{background:#1d7a55}.ob b{position:relative;z-index:1;padding:0 12px 0 4px}.ob .io{position:absolute;right:2px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:space-around;font-size:8px;line-height:1;color:#3d4753;font-weight:700;z-index:1}.ob .f{background:#2f5496}.ob .a{background:#a9c4e8}.ob .w{background:repeating-linear-gradient(135deg,#9fd3dc 0 4px,#d6eef2 4px 8px)}.ob.wait{border-color:#1f6f8b}.ob .orow .lh,.ob .orow .ls{top:auto;bottom:0;height:3px}.ob .lh{background:#d62828}.ob .ls{background:#1c2430}.ob.proc{border-color:#5c6675}.ob .p{background:repeating-linear-gradient(135deg,#c3c9d2 0 4px,#e6e9ee 4px 8px)}.ob.wip{border-color:#5c6675}.ob .m{background:repeating-linear-gradient(135deg,#d9c7a3 0 4px,#ecdfc4 4px 8px)}.ob.mat{border-color:#8a6d1f}.ob b{position:relative;font-weight:600;color:#1c2430;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}.ob.ok{border-color:#2f5496}.ob.part{border-color:#d08a1a;background:#fff4e0}.ob.part .a{background:#f3c977}.ob.no{border-color:#c0392b;background:#fdeceb}.ob.done{border-color:#1d7a55;background:#e4f3ec}.ob.done .f{background:#1d7a55}.ob.done b{color:#fff;text-shadow:none}.ob .f+.a+b{mix-blend-mode:normal}.ob.ok .f~b,.ob.part .f~b{color:#1c2430}.ob.none{color:#d0d5dd;border:0;background:none;min-width:40px}.ob{min-width:72px}
table.board th .rk.off{opacity:.6}table.board th .rc{margin-left:5px;font-size:10px;line-height:1;padding:3px 5px;border-radius:3px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;vertical-align:middle}table.board th button.rc:hover{background:#fff;color:#7a2e2e}table.board th .rc.done{cursor:default;border-color:transparent;opacity:.7}table.board th .rc.add{margin:0;background:#fff;color:#7a2e2e;font-weight:600}table.board th .rc.eb{background:#fff;color:#1d7a55;font-weight:700;border-color:#fff;padding:2px 6px}table.board th .rc.eb:hover{background:#ffe08a;color:#1c2430}
table.board td.ro{padding:0 8px;min-width:72px;cursor:pointer;color:var(--ink-2)}table.board td.ro:hover{background:#eef4fb}table.board td.ro.zero{color:#b0b8c4}table.board td.ro.warn{color:var(--red);font-weight:600}table.board td.ro small{color:var(--ink-3);font-weight:400}
.ctx{position:fixed;display:none;background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:5px;min-width:210px;z-index:600}
.ctx.open{display:block}
.ctx .hd{padding:5px 10px;font-size:11px;color:var(--ink-3);border-bottom:1px solid var(--line);margin-bottom:4px}
.ctx button{display:block;width:100%;text-align:left;padding:7px 10px;border-radius:4px;font-size:13px}
.ctx button:hover{background:#eef2f8}
.ctx button.ex{color:#9a6a0f}
.dlg .form{margin-top:10px}.dlg .msg{margin:8px 0 0}
table.g tr.sub td.sticky{background:#f6f7f9}
table.g tr.warn td.sticky{background:#fff0ee}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi small{color:var(--ink-3);font-size:12px;display:block}
.kpi b{font-size:20px;font-weight:700}
.kpi.red b{color:var(--red)}.kpi.amb b{color:#c47f12}.kpi.grn b{color:var(--green)}
.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;background:#e9edf3;color:var(--ink-2)}
.badge.red{background:#fde7e4;color:var(--red)}.badge.grn{background:#e1f5ec;color:#1d7a55}.badge.amb{background:#fdf0d8;color:#9a6a0f}
.flow{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
.flow .st{flex:1;min-width:120px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:#fff;position:relative}
.flow .st b{display:block;font-size:13px;margin-bottom:4px}
.flow .st small{display:block;color:var(--ink-3);font-size:11.5px;line-height:1.5}
.flow .st .n{font-size:18px;font-weight:700;margin:4px 0}
.flow .st.out{background:#fff8ea;border-color:#f3d79a}
.flow .st.ok{background:#eefaf4;border-color:#bfe8d4}
.flow .arrow{display:grid;place-items:center;color:var(--ink-3);font-size:18px;padding:0 2px}
.home{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.home>.card{grid-column:span 6}
.home>.card.w{grid-column:span 12}
.steps{display:grid;gap:8px}
.step{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff;cursor:pointer}
.step:hover{border-color:var(--blue);background:#f4f8ff}
.step .no{width:30px;height:30px;border-radius:50%;background:var(--steel);color:var(--amber);font-weight:700;display:grid;place-items:center}
.step b{font-size:14px}.step b small{font-weight:400;color:var(--ink-3);margin-left:6px}
.step p{font-size:12.5px;color:var(--ink-2);line-height:1.55;margin-top:3px}
.step.daily .no{background:var(--amber);color:var(--steel)}
.modcard{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.modcard button{border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:grid;gap:4px;background:#fff}
.modcard button b{font-size:14px}.modcard button small{color:var(--ink-3);font-size:11px;line-height:1.4;white-space:normal}
.modcard button:hover{border-color:var(--blue);background:#f4f8ff}
.link-tbl td{vertical-align:top;line-height:1.55}
.cellpl{color:var(--ink-3);font-size:11px}
.toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%);background:var(--steel);color:#fff;padding:10px 18px;border-radius:20px;box-shadow:var(--shadow);font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:999}
.toast.on{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(20,28,40,.45);display:none;align-items:center;justify-content:center;z-index:500}
.modal-bg.on{display:flex}#modalBg{z-index:600}
.modal.dlg{max-width:min(1200px,94vw);overflow:hidden}.dlg .form{min-width:0}.dlg .form .full.tw{min-width:0;max-width:100%;overflow:auto;white-space:nowrap}.dlg .form .full.tw table.g{min-width:max-content}
.modal{background:#fff;border-radius:8px;padding:18px 20px;min-width:300px;max-width:min(560px,92vw);box-shadow:var(--shadow);white-space:pre-line;line-height:1.6}
.modal .btns{justify-content:flex-end;margin-top:14px}
@media (max-width:1000px){.lay{grid-template-columns:1fr}.home>.card{grid-column:span 12}}
@media (max-width:900px){.top-menu,.search,.icon-btn span,#verTxt{display:none}.status{white-space:nowrap;overflow:hidden}.mobile-nav{display:block}.screen{padding:10px}.form{grid-template-columns:90px 1fr}.tw{max-height:none}.crumb{padding:6px 10px}}
@media print{.top,.tabs,.status,.crumb{display:none}.screen{position:static;overflow:visible}.tw{max-height:none;overflow:visible}}
</style>

const sortVal=t=>{t=t.trim();if(t===""||t==="-")return null;const n=Number(t.replace(/[,%\s]/g,""));return isNaN(n)?t:n};
function bindSort(root){root.querySelectorAll("table.g:not(.nosort) thead th").forEach(th=>{if(th._sort)return;th._sort=1;th.addEventListener("click",()=>{const i=th.cellIndex;const tb=th.closest("table").tBodies[0];const rows=[...tb.rows].filter(r=>r.cells.length>1);if(!rows.length)return;const desc=th.classList.contains("sorted")&&!th.classList.contains("desc");th.parentElement.querySelectorAll("th").forEach(x=>x.classList.remove("sorted","desc"));th.classList.add("sorted");if(desc)th.classList.add("desc");
  rows.sort((a,b)=>{const x=sortVal(a.cells[i].textContent),y=sortVal(b.cells[i].textContent);if(x===null&&y===null)return 0;if(x===null)return 1;if(y===null)return -1;const r=typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y),"ko",{numeric:true});return desc?-r:r});rows.forEach(r=>tb.appendChild(r))})})}

function modelMatSets(model){const mats=DB.matStock();let sets=0;for(const c of new Set(DB.partsOfModel(model).map(p=>DB.matCode(p.pn)))){const u=DB.matUnitKg(c);if(u)sets+=Math.floor((mats[c]||0)/u)}return sets}
/* 기종 안의 모든 주문을 연월·차수 순으로 보고 ① 품번별 출하대기(검사완료) → ② 검사대기 → ③ 열처리(빨간 선) → ④ 표면처리·사내대기(검은 선) → ⑤ 기종 PRESS → ⑥ 기종 공용 소재(환산 세트) 순으로 배정 */
function orderPlanModel(model,st){const parts=DB.partsOfModel(model);const pnSet=new Set(parts.map(p=>p.pn));const list=[...DB.d.orders].filter(o=>pnSet.has(o.pn)).sort((a,b)=>a.ym.localeCompare(b.ym)||(+a.round||0)-(+b.round||0)||a.id-b.id);
  /* INNER·OUTER 따로 재고 풀. PRESS는 기종 공용(제품별), 소재는 세트(INNER+OUTER 동시 생산) */
  const pool={};for(const pr of PRODS){const g=pool[pr]={D:{},W:{},H:{},S:{},press:Math.max(0,DB.q(st,model,pr,P.PRESS))};for(const p of parts){const q=proc=>Math.max(0,DB.q(st,p.pn,pr,proc));g.D[p.pn]=q(P.DONE);g.W[p.pn]=q(P.WAIT);g.H[p.pn]=q(P.HEAT);g.S[p.pn]=DB.hasSurf(p.pn)?q(P.HOLD)+q(P.SURF):0;if(!DB.hasSurf(p.pn))g.H[p.pn]+=q(P.HOLD)+q(P.SURF)}}
  let mat=modelMatSets(model);const out={};for(const p of parts)out[p.pn]=[];const closed=closedRounds();const RANK=["done","ok","wait","proc","wip","mat","part","no"];
  for(const o of list){const shP={INNER:DB.shippedP(o.id,"INNER"),OUTER:DB.shippedP(o.id,"OUTER")};const sh=Math.min(shP.INNER,shP.OUTER);const isClosed=!!closed[roundKey(o)];const done=isClosed||(o.qty>0&&shP.INNER>=o.qty&&shP.OUTER>=o.qty);const pr={};let need=0;
    for(const p of PRODS){const g=pool[p];const rem=Math.max(0,o.qty-shP[p]);let can=0,wt=0,wh=0,ws=0,wp=0;if(!done){let left=rem;const take=(obj,k)=>{const v=Math.min(left,obj[k]||0);obj[k]-=v;left-=v;return v};can=take(g.D,o.pn);wt=take(g.W,o.pn);ws=take(g.S,o.pn);wh=take(g.H,o.pn);wp=Math.min(left,g.press);g.press-=wp;left-=wp;need=Math.max(need,left)}pr[p]={sh:shP[p],rem,can,wt,wh,ws,wp,mt:0,left:done?0:rem-can-wt-ws-wh-wp}}
    const rem=Math.max(pr.INNER.rem,pr.OUTER.rem);const mtUse=done?0:Math.min(need,mat);mat-=mtUse;for(const p of PRODS){const x=pr[p];const r=x.rem;x.mt=Math.min(x.left,mtUse);x.got=x.can+x.wt+x.ws+x.wh+x.wp+x.mt;x.state=done?"done":r<=x.can?"ok":r<=x.can+x.wt?"wait":r<=x.can+x.wt+x.ws+x.wh?"proc":r<=x.can+x.wt+x.ws+x.wh+x.wp?"wip":r<=x.got?"mat":x.got>0?"part":"no"}
    const I=pr.INNER,O=pr.OUTER;const m2=k=>Math.min(I[k],O[k]);const state=RANK[Math.max(RANK.indexOf(I.state),RANK.indexOf(O.state))];
    out[o.pn].push({o,sh,rem,can:m2("can"),wt:m2("wt"),wh:m2("wh"),ws:m2("ws"),wp:m2("wp"),mt:m2("mt"),pr,state,closed:isClosed,key:roundKey(o)})}return out}

${det("INNER")}
${det("OUTER")}">${row(o,x.pr.INNER,"in")}${row(o,x.pr.OUTER,"out")}<b>${x.state==="done"?(x.closed?"■ ":"✓ "):""}${esc(lab)}</b><small class="io"><span>I</span><span>O</span></small></span>`}).join("")+`</span>`}

function nowRows(){const asOf=validDate($("#nowDate")?.value)||today();const st=DB.stock(asOf);const remP=DB.orderRemP();const mats=DB.matStock();const rows=[];
  const mrows=DB.models().map(m=>{const ps=DB.partsOfModel(m);const code=ps[0]?DB.matCode(ps[0].pn):m;const kg=mats[code]||0;const u=DB.matUnitKg(code);return{m,pns:ps.map(p=>p.pn).join(", "),pi:DB.q(st,m,"INNER",P.PRESS),po:DB.q(st,m,"OUTER",P.PRESS),kg,conv:u?Math.floor(kg/u):null}});
  const PROCS=[P.HEAT,P.HOLD,P.SURF,P.WAIT,P.DONE];

    for(const prod of PRODS){const vals={};let tot=0;for(const pr of PROCS){if(route.includes(pr)){vals[pr]=DB.q(st,p.pn,prod,pr);tot+=vals[pr]}else vals[pr]=null}
      const safe=prod==="INNER"?p.safe_in:p.safe_out;const done=vals[P.DONE]||0;
      const rm=remP[p.pn]?remP[p.pn][prod]:0;rows.push({pn:p.pn,model:DB.modelOf(p.pn),prod,surface:p.surface,vals,tot,safe,diff:tot-safe,rate:safe?tot/safe:null,pallet:p.pallet_qty?tot/p.pallet_qty:null,rem:rm,vs:done-rm})}}
  const cols=["품번","기종","제품","표면","열처리","사내대기","표면처리","검사대기","검사완료","재고합계","안전재고","과부족","확보율","팔레트","주문잔량","주문대비"];
  const data=rows.map(r=>[r.pn,r.model,r.prod,r.surface,...PROCS.map(pr=>r.vals[pr]===null?"-":r.vals[pr]),r.tot,r.safe,r.diff,r.rate===null?"":Math.round(r.rate*100)+"%",r.pallet===null?"":f1(r.pallet),r.rem,r.vs]);
  return{asOf,rows,cols,data,mrows}}

  const f=el.querySelector("#outForm");f.pn.onchange=f.kind.onchange=f.vendor.onchange=()=>outHint();f.qty_in.oninput=()=>setQtys(f);
  f.onsubmit=async e=>{e.preventDefault();if(!guard())return;const d=validDate(f.date.value),pn=f.pn.value;if(!d)return warn("일자를 확인하세요");const p=DB.part(pn);if(!p)return warn("품번을 고르세요");const q=readQtys(f);if(!q)return;const[qi,qo]=q;const kind=f.kind.value;let from,to,vFrom="",vTo="",tag;

      el.querySelector("#chgHint2").textContent=(DB.modelOf(pn)!==DB.modelOf(pn2)?"⚠ 기종이 다릅니다 (프레스 소재가 다름) · ":"")+`${pn2} 는 ${DB.hasSurf(pn2)?"표면처리 있음":"표면처리 없음"} → ${to} 로 받는 걸 권장`}};
  cf.pn.onchange=cf.proc.onchange=cf.pn2.onchange=chgHint;
  cf.onsubmit=async e=>{e.preventDefault();if(!guard())return;const d=validDate(cf.date.value);if(!d)return warn("일자를 확인하세요");const pn=cf.pn.value,pn2=cf.pn2.value,proc=cf.proc.value,proc2=cf.proc2.value;if(!DB.part(pn)||!DB.part(pn2))return warn("품번을 고르세요");if(pn===pn2&&proc===proc2&&proc!==P.SURF)return warn("같은 품번·같은 공정입니다");
    const q=readQtys(cf);if(!q)return;const[qi,qo]=q;const v=cf.vendor.value;if((proc===P.SURF||proc2===P.SURF)&&!SURF_VENDORS.includes(v))return warn("표면처리 업체를 고르세요");

  $("#outTbl").innerHTML=tbl([{h:"품번",cls:"c"},{h:"공정",cls:"c"},{h:"업체",cls:"c"},{h:"온도",cls:"c"},{h:"INNER"},{h:"OUTER"},{h:"팔레트 I"},{h:"팔레트 O"}],rows);
  const lg=[...DB.d.logistics].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id).slice(0,100);const w=$("#logiTbl");w.innerHTML=tbl([{h:"ID",cls:"c"},{h:"일자",cls:"c"},{h:"업체",cls:"c"},{h:"구분",cls:"c"},{h:"비용"},{h:"비고",cls:"l"}],lg.map(x=>({id:x.id,v:[x.id,x.date,x.vendor,x.kind,x.cost,esc(x.memo)]})));selectable(w);

def("insp","검사","외주·검사","검사","검사대기 → 검사완료 / 불량 폐기",function(el){

  el.innerHTML=`<div class="bar"><label>품번 <select id="movePn">${pnOpt()}</select></label><label>연월 <input type="month" id="moveYm" value="${ym()}"></label><button class="btn pri" id="moveBtn">이동표 만들기</button><button class="btn" id="moveXl">엑셀로 저장</button><b id="moveTitle" style="margin-left:10px"></b></div><div id="moveTbl"></div><div class="note">엑셀 품번 시트와 같은 표: 공정별 입고/출고/재고, 이월 = 전월 말 재고 · 빨강 = 마이너스 · PRESS 줄은 기종(세트) 기준이라 같은 기종 품번끼리 같은 숫자</div>`;
  el.querySelector("#moveBtn").onclick=()=>SCREENS.move.refresh();el.querySelector("#moveXl").onclick=()=>{const d=moveData();if(!d)return warn("품번과 연월을 고르세요");exportSheet(`${d.pn} 이동표 ${d.ym}`,["공정","제품","구분","이월",...[...Array(d.nd)].map((_,i)=>String(i+1)),"합계"],d.rows.map(r=>[...r.slice(0,4+d.nd),r[r.length-1]]))};
},function(){const d=moveData();const w=$("#moveTbl");if(!d){w.innerHTML="";$("#moveTitle").textContent="";return}$("#moveTitle").textContent=`RACEWAY (${d.pn}) 공정 이동표 - ${d.ym.slice(0,4)}. ${+d.ym.slice(5)}월`;
  const cols=[{h:"공정",cls:"c"},{h:"제품",cls:"c"},{h:"구분",cls:"c"},{h:"이월"},...[...Array(31)].map((_,i)=>({h:String(i+1)})),{h:"합계"}];
  w.innerHTML=tbl(cols,d.rows.map(r=>({cls:r[2]==="재고"?"sub":"",v:r.map(x=>x===0&&r[2]!=="재고"?"":x)})),{sticky:true,nosort:true})});
function moveData(){const pn=$("#movePn").value,y=$("#moveYm").value;if(!DB.part(pn)||!/^\d{4}-\d{2}$/.test(y))return null;const Y=+y.slice(0,4),M=+y.slice(5);const nd=new Date(Y,M,0).getDate();const d1=y+"-01";const route=DB.routeUsed(pn);const carry={},qin={},qout={};
  const model=DB.modelOf(pn);
  for(const m of DB.d.moves){const isModel=m.pn===model&&m.pn!==pn;if(m.pn!==pn&&!isModel)continue;for(const[proc,sign]of[[m.to_proc,1],[m.from_proc,-1]]){if(!proc||!route.includes(proc))continue;if(isModel&&proc!==P.PRESS)continue;if(!isModel&&proc===P.PRESS&&m.pn!==model)continue;const k=proc+"|"+m.prod;if(m.date<d1)carry[k]=(carry[k]||0)+sign*m.qty;else if(m.date.slice(0,7)===y){const day=+m.date.slice(8,10);const t=sign>0?qin:qout;t[k+"|"+day]=(t[k+"|"+day]||0)+m.qty}}}
  const rows=[];for(const proc of route)for(const prod of PRODS){const k=proc+"|"+prod;const ri=[proc,prod,"입고",""],ro=["","","출고",""],rs=["","","재고",carry[k]||0];let bal=carry[k]||0,si=0,so=0;for(let d=1;d<=31;d++){if(d>nd){ri.push("");ro.push("");rs.push("");continue}const a=qin[k+"|"+d]||0,b=qout[k+"|"+d]||0;bal+=a-b;si+=a;so+=b;ri.push(a);ro.push(b);rs.push(bal)}ri.push(si);ro.push(so);rs.push(bal);rows.push(ri,ro,rs)}return{pn,ym:y,nd,rows}}

  const rows=[];for(const m of DB.models())for(const prod of PRODS){const k=m+"|"+prod+"|"+P.PRESS;const c=carry[k]||0,a=qin[k]||0,b=qout[k]||0;rows.push([m+" (기종)",prod,P.PRESS,c,a,b,c+a-b])}

function bulkHTML(id){const b=BULK[id];return`<div class="card bulk" id="bulk_${id}"><details><summary>⇧ 일괄 입력 (엑셀 업로드 / 붙여넣기) · ${esc(b.name)}</summary>
  <div class="btns" style="margin:6px 0"><button class="btn sm" onclick="bulkTemplate('${id}')">⇩ 템플릿 받기</button><label class="btn sm" style="display:inline-flex;align-items:center">⇧ 엑셀 업로드<input type="file" accept=".xlsx,.xlsm,.csv" style="display:none" onchange="bulkFile('${id}',this)"></label><button class="btn sm pri" onclick="bulkPaste('${id}')">붙여넣은 내용 등록</button></div>
  <textarea placeholder="엑셀에서 범위를 복사해서 여기에 붙여넣기 (머리글 포함해도 되고, 템플릿 열 순서면 머리글 없어도 됩니다)&#10;열 순서: ${b.cols.map(c=>c[0]).join(" | ")}"></textarea>
  <div class="res"></div><div class="note">필수: ${b.cols.filter(c=>c[3]).map(c=>c[0]).join(", ")} · 날짜는 2026-10-08 또는 엑셀 날짜 · 틀린 줄이 하나라도 있으면 아무것도 등록하지 않습니다</div></details></div>`}
function bulkTemplate(id){const b=BULK[id];exportAoa(`${b.name}_템플릿`,[b.cols.map(c=>c[0]),b.ex])}
async function bulkFile(id,input){const f=input.files[0];input.value="";if(!f)return;if(typeof XLSX==="undefined")return warn("인터넷 연결이 필요합니다 (xlsx 라이브러리)");const wb=XLSX.read(await f.arrayBuffer(),{cellDates:true});const aoa=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""});bulkRun(id,aoa)}
function bulkPaste(id){const ta=document.querySelector(`#bulk_${id} textarea`);const lines=ta.value.split(/\r?\n/).filter(l=>l.trim()!=="");if(!lines.length)return warn("붙여넣은 내용이 없습니다");bulkRun(id,lines.map(l=>l.split("\t").map(x=>x.trim())),ta)}
function cellDate(v){if(v instanceof Date)return new Date(v.getTime()-v.getTimezoneOffset()*60000).toISOString().slice(0,10);if(typeof v==="number"&&v>20000&&v<80000&&typeof XLSX!=="undefined"){const x=XLSX.SSF.parse_date_code(v);return`${x.y}-${String(x.m).padStart(2,"0")}-${String(x.d).padStart(2,"0")}`}return validDate(String(v))}
function bulkRun(id,aoa,ta){if(!guard())return;const b=BULK[id];const res=document.querySelector(`#bulk_${id} .res`);const heads=b.cols.map(c=>c[0].replace(/\s/g,""));let idx=b.cols.map((_,i)=>i),start=0;
  const first=(aoa[0]||[]).map(x=>String(x??"").replace(/\s/g,""));const match=first.filter(x=>heads.includes(x)).length;
  if(match>=2){idx=b.cols.map(c=>first.indexOf(c[0].replace(/\s/g,"")));start=1}
  const rows=[],errs=[];const bk0=JSON.stringify(DB.d);
  for(let i=start;i<aoa.length;i++){const raw=aoa[i];if(!raw||raw.every(x=>String(x??"").trim()===""))continue;const r={};let err=null;
    b.cols.forEach((c,ci)=>{if(err)return;const[h,key,type,req,vals]=c;const j=idx[ci];let v=j>=0?raw[j]:"";if(v==null)v="";
      if(type==="date"){const d=cellDate(v);if(req&&!d)err=`${h} 날짜`;r[key]=d||""}
      else if(type==="int"||type==="num"){try{r[key]=type==="int"?toInt(v):toNum(v)}catch(e){err=`${h} 숫자`}if(req&&!r[key]&&r[key]!==0)err=err||`${h} 필요`}
      else if(type==="pn"){r[key]=String(v).trim();if(!DB.part(r[key]))err=`품번 '${r[key]}' 기준에 없음`}
      else if(type==="model"){r[key]=String(v).trim();if(!DB.models().includes(r[key]))err=`기종 '${r[key]}' 없음 (${DB.models().join("/")})`}
      else if(type==="pnmodel"){r[key]=String(v).trim();if(!DB.part(r[key])&&!DB.models().includes(r[key]))err=`'${r[key]}' 품번/기종 아님`}
      else if(type==="enum"){r[key]=String(v).trim().replace(/\s/g,"");if(!vals.includes(r[key]))err=`${h}: ${vals.join("/")} 중 하나`}
      else{r[key]=String(v).trim();if(req&&!r[key])err=`${h} 필요`}});
    if(!err){const bk=JSON.stringify(DB.d);err=b.apply(r);if(err)DB.d=JSON.parse(bk)}
    if(err)errs.push(`${i+1}행: ${err}`);else rows.push(r)}
  if(errs.length){res.className="res err";res.textContent=`등록 안 함 — 틀린 줄 ${errs.length}개\n`+errs.slice(0,12).join("\n")+(errs.length>12?"\n…":"");DB.d=JSON.parse(bk0);return}
  if(!rows.length){res.className="res err";res.textContent="등록할 줄이 없습니다";return}
  changed();if(id==="base")rebuildPnLists();res.className="res ok";res.textContent=`${rows.length}줄 등록했습니다.`;if(ta)ta.value="";toast(`${b.name} ${rows.length}줄 일괄 등록`)}

/* 데이터 메뉴 */
$("#btnExportJson").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(DB.d)],{type:"application/json"}));a.download=`raceway_backup_${today()}.json`;a.click();toast("백업 파일 저장")};
$("#fileImportJson").onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!d.parts||!d.moves)throw 0;if(await confirmBox(`백업 파일(품번 ${d.parts.length}, 기록 ${d.moves.length}건)로 지금 데이터를 바꿉니다. 계속할까요?`)){DB.d=d;for(const t of Object.keys(SEED))DB.d[t]??=[];changed();rebuildPnLists();openScreen("home");toast(SB_ON?"백업 내용을 서버에 반영하는 중…":"불러오기 완료")}}catch(err){warn("백업 파일이 아닙니다")}e.target.value=""};
$("#fileImportXl").onchange=async e=>{const f=e.target.files[0];if(f&&guard())await importXl(f);e.target.value=""};
$("#btnXlMove").onclick=()=>{if(guard())$("#fileXlMove").click()};$("#rcptBell").onclick=()=>{openScreen("mat");setTimeout(()=>matReceiptPop(),150)};$("#fileXlMove").onchange=async e=>{const f=e.target.files[0];if(f)await importMoveXl(f);e.target.value=""};
$("#btnExportXl").onclick=exportAll;
$("#btnReset").onclick=async()=>{if(SB_ON){if(!guard())return;if(!await confirmBox("⚠ 서버(Supabase)의 RACEWAY 데이터를 전부 지우고 엑셀 원본(2026-10-08)으로 되돌립니다.\n모든 PC에 영향을 줍니다. 정말 할까요?"))return;if(!await confirmBox("한 번 더 확인합니다. 서버 데이터 전체 삭제 → 엑셀 원본 올리기. 진행할까요?"))return;try{await SB.wipe();await SB.seedIfEmptyForce();openScreen("home")}catch(e){toast("⚠ 실패: "+e.message)}return}
  if(await confirmBox("브라우저에 저장된 변경분을 지우고 엑셀 원본(2026-10-08) 데이터로 되돌립니다. 계속할까요?")){DB.reset();rebuildPnLists();changed();openScreen("home");toast("초기화 완료")}};
$("#btnReload").onclick=()=>SB.reload();
SB.seedIfEmptyForce=async function(){DB.d=JSON.parse(JSON.stringify(SEED));applyVendorSettings();DB.migrateMoves();this.snap=Object.fromEntries(TABLES.map(t=>[t,[]]));await this.sync();await this.load();rebuildPnLists();toast("엑셀 원본 데이터를 서버에 올렸습니다")};
$("#chkView").onchange=e=>{VIEW_ONLY=e.target.checked;try{localStorage.setItem(LS_VIEW,VIEW_ONLY?"1":"")}catch(x){}document.querySelectorAll(".btn.pri,.btn.danger").forEach(b=>b.disabled=VIEW_ONLY);renderCrumb();toast(VIEW_ONLY?"조회 전용 모드":"입력 가능")};
/* 시작 */
const src=DB.load();$("#dataHd").textContent=src==="supabase"?"Supabase (ESG SmartFactory) 공용 데이터":src==="browser"?"브라우저에 저장된 데이터":"엑셀 원본 데이터 (첫 실행)";
try{VIEW_ONLY=localStorage.getItem(LS_VIEW)==="1";$("#chkView").checked=VIEW_ONLY}catch(e){}
function restoreTabs(){openScreen("home");let restored=false;try{const st=JSON.parse(sessionStorage.getItem(LS_TABS)||"null");if(st&&st.ids){st.ids.forEach(id=>SCREENS[id]&&openScreen(id));if(SCREENS[st.active]){openScreen(st.active);restored=true}}}catch(e){}if(!restored||activeId==="home")openScreen("board");if(VIEW_ONLY)document.querySelectorAll(".btn.pri,.btn.danger").forEach(b=>b.disabled=true)}
if(SB_ON){$("#btnReload").style.display="";$("#statusMsg").textContent="서버에서 불러오는 중…";
  (async()=>{try{await SB.load();await SB.seedIfEmpty();rebuildPnLists();setTimeout(checkNewReceipts,800)}catch(e){console.error(e);$("#statusMsg").textContent="서버 연결 실패: "+e.message;await confirmBox("Supabase 연결에 실패했습니다.\n"+e.message+"\n\n테이블이 아직 없으면 raceway_supabase.sql 을 SQL Editor에서 먼저 실행하세요.\n(이 창은 서버 없이 비어 있는 상태로 열립니다)")}restoreTabs()})();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!SB.busy&&Date.now()-SB.lastLoad>30000)SB.reload();if(!document.hidden)checkNewReceipts()});
  setInterval(checkNewReceipts,10*60*1000);
}else{const a=applyVendorSettings(),b=DB.migrateMoves();if(a||b)DB.save();restoreTabs()}
setInterval(()=>$("#now").textContent=new Date().toLocaleString("ko-KR",{dateStyle:"medium",timeStyle:"medium"}),1000);
</script>
</body>
</html>
